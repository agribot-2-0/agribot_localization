
# Wheel odometry
odom0: agribot/odom/raw
odom0_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, true,
               false, false, false]
odom0_queue_size: 1
odom0_nodelay: false
odom0_differential: false
odom0_relative: false


# Filtered (Madgwick/complementary filter) IMU
imu0: agribot/imu/filtered
imu0_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              true,  true,  true,
              false, false, false]
imu0_queue_size: 1
imu0_nodelay: false
imu0_differential: false
imu0_relative: true
# imu0_pose_rejection_threshold: 0.8
# imu0_twist_rejection_threshold: 0.8
# imu0_linear_acceleration_rejection_threshold: 0.8
imu0_remove_gravitational_acceleration: true
